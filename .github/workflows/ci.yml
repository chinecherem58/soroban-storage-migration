name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Format · Lint · Build · Test
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Rust toolchain ───────────────────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      # ── Cache ────────────────────────────────────────────────────────────────
      - name: Cache Cargo registry & build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── Format check ─────────────────────────────────────────────────────────
      - name: Check formatting
        run: cargo fmt --all -- --check

      # ── Clippy ───────────────────────────────────────────────────────────────
      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path contracts/token-migration/Cargo.toml --all-targets -- -D warnings

      # ── Build WASM ───────────────────────────────────────────────────────────
      - name: Build release WASM
        run: cargo build --target wasm32-unknown-unknown --release --manifest-path contracts/token-migration/Cargo.toml

      # ── Tests ────────────────────────────────────────────────────────────────
      - name: Run tests (native)
        run: cargo test --manifest-path contracts/token-migration/Cargo.toml

      - name: Run tests (optimised profile)
        run: cargo test --profile test-optimized --manifest-path contracts/token-migration/Cargo.toml
